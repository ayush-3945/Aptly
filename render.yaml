services:
  - type: web
    name: aptly-api
    runtime: node
    rootDir: JobMatch-AI
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
